<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅 애플리케이션</title>
    <link rel="stylesheet" href="client.css">
</head>
<body>
    <!-- 닉네임 설정 모달 -->
    <div id="nicknameModal" class="modal">
        <div class="modal-content">
            <h2>닉네임을 입력하세요</h2>
            <input type="text" id="nicknameInput" placeholder="닉네임">
            <button id="submitNickname">확인</button>
        </div>
    </div>
    <div class="container">
        <!-- 사이드바 - 참가자 목록 -->
        <div class="sidebar">
            <div class="user-profile">
                <img src="default-avatar.png" alt="프로필" class="profile-img">
                <span class="username">사용자 이름</span>
            </div>
            <h3>참가자 목록</h3>
            <ul class="participants-list" id="participantsList">
                <!-- 참가자들이 여기에 동적으로 추가됩니다 -->
            </ul>
        </div>

        <!-- 메인 채팅 영역 -->
        <div class="main-content">
            <!-- 채팅방 정보 -->
            <div class="chat-header">
                <h2>채팅방 이름</h2>
                <span class="participant-count">참가자: 3명</span>
            </div>

            <!-- 채팅 메시지 영역 -->
            <div class="chat-messages" id="chatMessages">
                <!-- 메시지들이 여기에 동적으로 추가됩니다 -->
            </div>

            <!-- 메시지 입력 영역 -->
            <div class="message-input-area">
                <input type="text" id="messageInput" placeholder="메시지를 입력하세요...">
                <button id="sendButton">전송</button>
                <button id="fileButton" class="file-button">📎</button>
            </div>
        </div>
    </div>
    <script src="client.js"></script>
</body>
</html>
